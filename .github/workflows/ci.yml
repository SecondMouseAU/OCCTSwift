name: CI

# Fast per-PR/per-push gate. Deliberately does NOT rebuild OCCT from source: a clean checkout has
# no local Libraries/, so Package.swift's binaryTarget resolves OCCT.xcframework from its pinned
# release URL and verifies the checksum, which only costs a download. A PR that touches
# Scripts/patches/ (a carried kernel patch not yet in a release) also gets
# kernel-integration.yml, which rebuilds from source and runs swift test against that binary.
# This workflow's macOS check resolves whatever Package.swift pins, so a patch NEWER than the
# pinned asset will fail that patch's own regression tests here (#585). The fix is to publish
# the next vX.Y.Z-kernel.N pre-release and bump the pin (docs/guides/building-occt.md step 4),
# not to treat this job as permanently unreliable: as of the v2.0.0-kernel.1 pin it is green.
# OCCTBridge compiles from source by default (no OCCTSWIFT_BRIDGE_PREBUILT set), which is the
# repo's own intended default, see the comment above `useBridgePrebuilt` in Package.swift, and
# it's a couple of minutes, not tens of minutes.

on:
  pull_request:
  push:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo's static gate scripts. Deliberately a separate job, on Linux, ahead of nothing:
  #
  #   - separate job, not a step in build-and-test, so it reports in well under a minute instead of
  #     behind the ~6-minute build, and so it carries its own status check. That second half is the
  #     load-bearing one: build-and-test goes red branch-wide whenever the branch carries a kernel
  #     patch newer than Package.swift's pinned xcframework (#585), and a gate folded into that
  #     job would be red for a reason that has nothing to do with it, which is the same as not
  #     having it. That state is fixable by bumping the pin, and is fixed today, but the
  #     separation is what makes the gate survive the next time it happens.
  #   - ubuntu-latest, because all twenty-three are pure Python over the repo's own text: no Xcode, no
  #     OCCT, no swift build. A macOS runner would cost 10x the minutes to run the identical checks.
  #     The twenty-first is here as its `--self-test` alone for exactly that reason: the real run of
  #     check-pinned-asset-patches.py reads the pinned xcframework, which is not text (#2196).
  #   - each script's --self-test runs alongside its real invocation. A gate whose detector is
  #     wrong reports "all clear" just as confidently as a gate whose subject is clean; this branch
  #     shipped three gate scripts that were confidently wrong (#618, #624/#630, #626), so the
  #     detector's own fixtures are part of what CI checks, not a developer-only convenience.
  #   - `if: '!cancelled()'` on every step after the first, so one failing gate does not hide the
  #     other twenty-two. Without it a contributor fixes them one CI round trip at a time. It is
  #     `!cancelled()` rather than `always()` so the concurrency group's cancel-in-progress still
  #     takes effect.
  #
  # Some of these resolve their inputs relative to the working directory and exit 2 with "run from
  # the repo root" elsewhere (#625); the rest resolve from __file__. A GitHub Actions step starts at
  # the repo root, so both kinds are satisfied. The counts in this comment are gated by
  # check-inventory-prose.py, which is why they are worth stating at all.
  #
  # derive-bridge-header-split.py joined in #673: --verify answers a question that
  # keeps mattering after the one-time #395 split it was written for -- does each bridge
  # declaration still sit in the header its .mm owns -- and every ~100-operation release adds
  # declarations by hand, so the drift this checks for is ongoing, not a one-off migration risk.
  # It runs `--verify`, not the bare form: the bare form only prints the manifest and always exits
  # 0, unlike its three self-test-carrying siblings above, whose bare invocation already gates.
  # Deliberately NO `name:` key. The check-run name GitHub publishes is a job's `name:` when it has
  # one and the job id otherwise, and that string is what a required-status-check rule matches. A
  # prose name reads like a comment, so rewording it for clarity would silently stop satisfying the
  # rule, the check would drop out of "required" and the PR UI would look identical to a working
  # gate. Falling back to the job id makes the required context a stable identifier nobody edits for
  # readability. This job is required on refactor/** (#649); see CLAUDE.md before renaming it.
  gate-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every action pin across .github/workflows/ now targets a Node 24 major (#648). The target
      # for each was established by reading that action's own action.yml at the pinned ref and
      # checking `using:`, not by assuming a version number implies a runtime, actions/github-script
      # is node20 at v7 and only reaches node24 at v8, so a "match the v7 the other pins use" rule
      # would have left require-issue-labels.yml deprecated while looking consistent.
      #
      # Deprecation annotations are emitted per JOB, not per workflow, so one stale v4 pin anywhere
      # raises its own "Node.js 20 is deprecated" warning on that job alone; keep new jobs on these
      # majors rather than copying an older workflow's pins.
      - uses: actions/checkout@v7

      # Pinned rather than the image default: these gates parse Swift and C++ with regexes, and a
      # runner-image Python bump silently changing a verdict is exactly the failure mode the gates
      # exist to prevent. Nothing here needs a third-party package, stdlib only (re, sys, os,
      # glob, argparse, collections), so there is no install step.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: check-bridge-index.py --self-test
        run: python3 Scripts/check-bridge-index.py --self-test

      - name: check-bridge-index.py
        if: '!cancelled()'
        run: python3 Scripts/check-bridge-index.py

      - name: check-null-handle-guards.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-null-handle-guards.py --self-test

      - name: check-null-handle-guards.py
        if: '!cancelled()'
        run: python3 Scripts/check-null-handle-guards.py

      - name: check-docs-defaults.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-docs-defaults.py --self-test

      - name: check-docs-defaults.py
        if: '!cancelled()'
        run: python3 Scripts/check-docs-defaults.py

      # #802: checks that a symbol docs/ documents as current API still exists in
      # Sources/OCCTSwift. Sibling of check-docs-defaults.py above (which checks a documented
      # *default*, not existence), a symbol check-docs-defaults never sees because it was already
      # resolved to a live declaration is exactly the gap this closes.
      - name: check-docs-existence.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-docs-existence.py --self-test

      - name: check-docs-existence.py
        if: '!cancelled()'
        run: python3 Scripts/check-docs-existence.py

      # #965: a struct has no deinit, so a struct that stores an OCCT*Ref borrows a handle whose
      # lifetime it does not control. Nineteen `*Properties` views did exactly that, which made
      # `edge.curve3D?.circleProperties.radius` a use-after-free. The fix is nineteen conversions,
      # and this is what keeps them from silently becoming eighteen.
      - name: check-borrowed-handles.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-borrowed-handles.py --self-test

      - name: check-borrowed-handles.py
        if: '!cancelled()'
        run: python3 Scripts/check-borrowed-handles.py

      - name: derive-bridge-header-split.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/derive-bridge-header-split.py --self-test

      - name: derive-bridge-header-split.py --verify
        if: '!cancelled()'
        run: python3 Scripts/derive-bridge-header-split.py --verify

      # #996: GDTRead.swift's four GD&T enums are transcribed member for member from OCCT's own
      # XCAFDimTolObjects headers, and the bridge casts OCCT's enum straight to int32 with no
      # sentinel, so a member OCCT adds turns into a silently dropped dimension rather than an
      # error. --verify compares Swift against the committed Scripts/occt-gdt-enums.txt and needs
      # no kernel, which is why it is the half that gates here. --reverify-headers is the other
      # half and needs Libraries/, absent on this runner; run it locally after an OCCT bump.
      - name: derive-gdt-enums.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/derive-gdt-enums.py --self-test

      - name: derive-gdt-enums.py --verify
        if: '!cancelled()'
        run: python3 Scripts/derive-gdt-enums.py --verify

      # No --self-test of its own. It takes no options other than --fix/--audit and rejects an
      # unrecognised one (exit 2), so it is invoked bare; `--self-test` would otherwise be the
      # natural thing to write when extending this list, and read as a passing self-test that
      # never existed rather than the usage error it actually is.
      - name: count-operations.py
        if: '!cancelled()'
        run: python3 Scripts/count-operations.py

      - name: check-inventory-prose.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-inventory-prose.py --self-test

      - name: check-inventory-prose.py
        if: '!cancelled()'
        run: python3 Scripts/check-inventory-prose.py

      - name: check-throwing-calls.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-throwing-calls.py --self-test

      - name: check-throwing-calls.py
        if: '!cancelled()'
        run: python3 Scripts/check-throwing-calls.py

      # #2058, from the #2056 incident: carried patch 0035 deleted STEPControl_Writer::Transfer's
      # InitializeMissingParameters() call, which is the whole of what protects consumers from #280
      # now that the bridge workaround is gone, and #280's regression test reported it 1h5m later in
      # kernel-integration.yml. This reads the patch diffs against the symbols test comments name,
      # so it needs no Libraries/occt-src and belongs here rather than an hour into the kernel job.
      - name: check-patch-deletes-guarded-symbol.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-patch-deletes-guarded-symbol.py --self-test

      - name: check-patch-deletes-guarded-symbol.py
        if: '!cancelled()'
        run: python3 Scripts/check-patch-deletes-guarded-symbol.py

      # #2167, from PR #2076: three of its fifteen WASI patches left an OCCT source file that no
      # compiler could preprocess, on EVERY platform rather than only WASI, behind a green check
      # reading "all 14 patches apply cleanly". Applying cleanly and preprocessing are different
      # properties. This reads the patch text for directive deltas, so like its #2058 sibling it
      # needs no Libraries/occt-src and belongs here. Its deeper --tree mode does need a checkout
      # and is deliberately NOT run in this job; the wasm build job is where that belongs.
      - name: check-preprocessor-balance.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-preprocessor-balance.py --self-test

      - name: check-preprocessor-balance.py
        if: '!cancelled()'
        run: python3 Scripts/check-preprocessor-balance.py

      # #2168, from the same PR #2076: its fifteen WASI patches were authored against a pristine
      # V8_0_1 and verified by applying them to one, which is not the tree build-occt-wasm.sh
      # patches. Nine carried patches inject std::mutex into OCCT, so 15 of the 76
      # threading-dependent files are files we patch ourselves, and none of that is visible from
      # vanilla. This reads both patch sets as text, so like its two siblings above it needs no
      # Libraries/occt-src. The --tree mode runs the real `git apply --check` with the carried set
      # applied and is deliberately NOT here; the wasm build job is where that belongs.
      - name: check-wasi-patch-base.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-wasi-patch-base.py --self-test

      - name: check-wasi-patch-base.py
        if: '!cancelled()'
        run: python3 Scripts/check-wasi-patch-base.py

      # #2269. The two platforms pin OCCT separately and nothing connected them: Package.swift
      # names the native kernel as a binaryTarget url:/checksum: pair, while the wasm kernel is a
      # release asset recorded in Scripts/wasm-kernel-pin.txt, because SwiftPM's binaryTarget takes
      # an xcframework and never a bare static library. A native repin that does not also rebuild
      # the wasm asset leaves the browser on an older kernel, silently, and a carried patch is a
      # correctness fix.
      #
      # It belongs HERE and not only in wasm.yml, and that is the whole point: the PR that has to
      # be caught is a NATIVE repin, which touches Package.swift and no wasm path at all. A check
      # that runs only when wasm files change would never see it.
      - name: check-wasm-kernel-parity.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-wasm-kernel-parity.py --self-test

      - name: check-wasm-kernel-parity.py
        if: '!cancelled()'
        run: python3 Scripts/check-wasm-kernel-parity.py

      # #2077. #1161's caught-exception diagnostics channel shipped with 1 of the 74 bridge .mm
      # files instrumented and was swept across the rest; this is what stops the sweep decaying.
      # A new bridge function written with a bare `catch (...) { return nullptr; }` returns a nil
      # that explains nothing, and nothing else in CI would notice.
      - name: check-bridge-diagnostics.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-bridge-diagnostics.py --self-test

      - name: check-bridge-diagnostics.py
        if: '!cancelled()'
        run: python3 Scripts/check-bridge-diagnostics.py

      # A hand-resolved conflict can leave a marker behind, and this repo sets
      # merge.conflictStyle=diff3, whose `|||||||` ancestor line is exactly the one a resolver
      # written for the default two-way style does not think to strip. Five of them reached
      # docs/CHANGELOG.md on this branch across several merges before a reviewer noticed, because
      # nothing was looking. grep is the whole check; the point is that something looks at all.
      - name: no conflict markers in tracked files
        if: '!cancelled()'
        run: |
          if git grep -nE '^(<<<<<<< |\|\|\|\|\|\|\| |>>>>>>> )' -- . ; then
            echo "::error::merge conflict markers found in tracked files (see matches above)"
            exit 1
          fi
          echo "no conflict markers in tracked files"


      # #726's census is the one entry here that is NOT a gate, and only its --self-test runs.
      # A gate answers "is the tree clean" and exits 1 when it is not; this answers "which sites
      # need a human to adjudicate" and exits 0 either way, so running it bare would add a step
      # that can never fail and therefore never signal. Its detector can still rot, which is the
      # failure the other four exist to prevent, so the self-test is what CI holds it to.
      - name: census-unmeasured-values.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-unmeasured-values.py --self-test

      # #742's backstop for okf/policies/changelog-on-merge.md, and #2779 settled two things about
      # it that this comment used to get wrong.
      #
      # It will never be --strict here, and not because of a false-positive rate. It asks a
      # post-merge question, so on a protected base as a required check it would fail every open PR
      # for the PREVIOUS merge's omission, which that PR's author cannot fix. The remedy went the
      # other way instead: Scripts/merge-pr.py does the transcription as part of merging, so this is
      # the backstop for a merge made by hand rather than the mechanism.
      #
      # AND ITS BARE RUN HERE EXAMINES NOTHING. default_since() looks for the commit that added the
      # policy file, falls back to the last tag, then to the root commit; actions/checkout fetches
      # depth 1 and no tags, so all three resolve to HEAD and the step prints "Merges audited: 0".
      # It is left in place deliberately, because both fixes are decisions rather than tidying:
      # fetch-depth: 0 doubles this job's cheapest step, and a --require-history flag on the #2098
      # precedent needs that depth first or gate-scripts goes red on every PR at once. See
      # okf/policies/static-gates.md. Its --self-test does gate from day one, because a blind
      # detector is the failure this whole family exists to prevent.
      - name: check-changelog-transcription.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-changelog-transcription.py --self-test

      - name: check-changelog-transcription.py
        if: '!cancelled()'
        run: python3 Scripts/check-changelog-transcription.py

      # #928's over-coverage detector, and the second entry here that is a census rather than a
      # gate: it exits 0 either way, so a bare run could never fail and therefore never signal.
      # Only the --self-test runs, for the same reason census-unmeasured-values.py's does. It is
      # also the only one of these whose bare run would need `Libraries/OCCT.xcframework`, absent
      # on this runner, and it would report a smaller number rather than saying so if it were run
      # here. The measured false-positive rate (41% over a 40-row adjudicated sample) is why it is
      # not a gate today; #928's PR body records what promoting it would take.
      - name: census-doc-occt-attribution.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-doc-occt-attribution.py --self-test

      # A census, not a gate, for the same reason as the two above: a bare run lists
      # `@Test(arguments:)` sites whose element type a human has to open and judge, and it exits 0
      # either way, so only the `--self-test` can signal here. The shape it looks for is #1057's:
      # an element pairing a reference-counted member with a builtin vector of 32 bytes or more,
      # which corrupts the Swift task allocator regardless of what the test body does
      # (swiftlang/swift#91639). The pair is necessary and not sufficient, so the census reports
      # `unknown` where it cannot resolve a named type rather than guessing.
      - name: census-arguments-tuple-shapes.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-arguments-tuple-shapes.py --self-test

      # #872's census, same shape as the three above: a bare run lists dotted `` `Type.member` ``
      # mentions inside Sources/ comments (plus Scripts/*.py usage-flag and CLAUDE.md patch-number
      # citations) that no longer resolve, for a human to adjudicate, and exits 0 either way, so
      # only the self-test signals here.
      - name: census-comment-staleness.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-comment-staleness.py --self-test

      # #1679's census, same shape again: a bare run lists docs/API_REFERENCE.md category-row
      # entries that resolve to no declaration in Sources/, for a human to adjudicate, and exits 0
      # either way. A gate is not possible here: the rows mix real symbols with umbrella names,
      # abbreviations and category labels, and no mechanical rule separates them.
      - name: census-api-reference-rows.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-api-reference-rows.py --self-test

      # #1628's census, same shape again: a bare run lists `static` definitions in
      # Sources/OCCTBridge/src that nothing in their own file calls, for a human to adjudicate, and
      # exits 0 either way. A dead file-static is not a defect, so there is no verdict to gate on:
      # the compiler drops it and -Wunused-function does not fire on it either. What it costs is
      # paid by readers and by later audits, which is a list rather than a pass/fail.
      - name: census-dead-file-statics.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/census-dead-file-statics.py --self-test

      # #2196. The one RELEASE CHECK in this job, and the only entry here whose bare run is not a
      # thing this runner could do: check-pinned-asset-patches.py reads Libraries/OCCT.xcframework,
      # 157 MB of static archive per slice across three slices, which nothing checks out here and
      # which this job's whole property is not needing. Its real verdict is taken at the pin step
      # (CLAUDE.md's Release Process, okf/policies/pinned-kernel-patch-check.md), where the
      # question is live.
      #
      # Its --self-test is a different thing: pure Python, no asset, 0.4 s, and it is the half that
      # can rot between pins. A detector consulted once a release is the one whose blindness costs
      # most, because a false clean there is what #2190 actually was: every count agreed with every
      # other count and the asset shipped with two patches nobody had reverted.
      #
      # Counted as neither a gate nor a census, in ci.yml's own comment above and in CLAUDE.md:
      # a gate's bare run gates here and this one is absent, a census's bare run exits 0 whatever
      # it finds and this one reaches a verdict. See okf/policies/static-gates.md.
      - name: check-pinned-asset-patches.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-pinned-asset-patches.py --self-test

  build-and-test:
    name: swift build + test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # README states Xcode 16.0+ / Swift 6.1+. latest-stable tracks forward as the
          # runner image updates; pin to an explicit version here if that ever regresses.
          xcode-version: latest-stable

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift build
        run: swift build

      # #1683. This one cannot live in gate-scripts: that job is pure Python with no OCCT and no
      # build, and type-checking a doc snippet needs the OCCTSwift module the step above just built.
      # It is a CENSUS, so it exits 0 whatever it finds; the bare run still earns its place here
      # because its output IS the number, and a minute against a build already paid for is the
      # cheapest place to print it. Promotion to a gate is `--strict` plus a rename to `check-`,
      # once the backlog it reports reaches zero. See okf/policies/static-gates.md.
      - name: check-doc-snippets --self-test
        run: python3 Scripts/check-doc-snippets.py --self-test --require-typecheck

      - name: check-doc-snippets (every fenced Swift snippet type-checks)
        run: python3 Scripts/check-doc-snippets.py --require-typecheck

      # #2714: this single process runs all 6,388 tests in one `OCCTSwiftPackageTests` bundle
      # (the whole point of this job, see the header comment), and about once in forty runs it
      # dies from an uncatchable SIGSEGV/SIGBUS before a single test finishes. `tee`ing to a file
      # rather than only letting `swift test` print to the step's own log is what lets the
      # detection step below grep it; the default macOS/Linux `run:` shell already invokes
      # `bash --noprofile --norc -eo pipefail {0}`, so this step still fails on `swift test`'s own
      # exit code, `tee` does not hide it.
      - name: swift test
        run: swift test 2>&1 | tee swift-test-output.log

      # #2714 step 1: "the evidence that has been missing since #922." The log above carries no
      # backtrace and no test attribution when the process dies this way, which is exactly what
      # has blocked root-causing it. macOS writes a crash report with the faulting thread's
      # backtrace and every thread's stack to one of these two directories; one captured report
      # likely settles library-versus-harness. The path is a glob (`/*`, not the bare directory),
      # so this is a no-op, not a failure, both when a directory is absent and when an ordinary
      # test-assertion failure leaves it empty; `if-no-files-found: ignore` says the same for the
      # upload step itself.
      - name: Upload crash diagnostic reports (#2714)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Library/Logs/DiagnosticReports/*
            /Library/Logs/DiagnosticReports/*
          if-no-files-found: ignore
          retention-days: 30

      # #2714 step 7, reporting half only: no automatic re-run (out of scope for this PR, see the
      # issue). Signature: an uncatchable SIGSEGV/SIGBUS ("no catch was found" or "unexpected
      # signal code") together with zero finished tests (no `✔`/`✘` line, because nothing
      # completed before the process died). Recording the match in the job summary is what lets
      # #2714's occurrences table keep growing without a human reading a raw log. `set +e` and the
      # trailing `exit 0` mean this step can never itself fail the job or change its outcome: it
      # only runs after `swift test` already has, via `if: failure()`, and it does not retry
      # anything.
      - name: Detect the #2714 startup-crash signature
        if: failure()
        run: |
          set +e
          log=swift-test-output.log
          if [ -f "$log" ] && grep -qE 'no catch was found|unexpected signal code' "$log" \
              && ! grep -qE '✔|✘' "$log"; then
            {
              echo '## #2714 startup-crash signature detected'
              echo
              echo 'This run matches the pattern tracked in'
              echo '[#2714](https://github.com/SecondMouseAU/OCCTSwift/issues/2714): an uncatchable'
              echo 'SIGSEGV/SIGBUS ("no catch was found" or "unexpected signal code") with zero'
              echo '`✔`/`✘` lines, meaning zero tests finished before the process died.'
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "Commit: ${GITHUB_SHA}"
              echo
              echo 'Matched line(s):'
              echo '```'
              grep -E 'no catch was found|unexpected signal code|SIGSEGV|SIGBUS|Address' "$log" | head -20
              echo '```'
              echo
              echo 'Add this occurrence to the table in #2714. This step does not retry the job;'
              echo 'the job still fails.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  ios-simulator-build:
    name: swift build (iOS Simulator, smoke)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-ios-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-ios-

      # Build-only: catches #if os(iOS) / platform-conditional breakage without the cost
      # or flakiness of booting a simulator to run the full suite there too.
      - name: xcodebuild for iOS Simulator
        run: |
          xcodebuild build \
            -scheme OCCTSwift \
            -destination 'generic/platform=iOS Simulator'
