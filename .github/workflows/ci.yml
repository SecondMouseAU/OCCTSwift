name: CI

# Fast per-PR/per-push gate. Deliberately does NOT rebuild OCCT from source (that is a manual
# local `Scripts/build-occt.sh` run, ~30-60 min, done only when a carried patch in
# Scripts/patches/ needs to reach the shipped binary). A clean checkout has no local Libraries/, so
# Package.swift's binaryTarget resolves OCCT.xcframework from its pinned release URL and
# verifies the checksum, which only costs a download. OCCTBridge compiles from source by
# default (no OCCTSWIFT_BRIDGE_PREBUILT set), which is the repo's own intended default, see
# the comment above `useBridgePrebuilt` in Package.swift, and it's a couple of minutes, not
# tens of minutes.

on:
  pull_request:
    branches:
      - main
      - 'refactor/**'
  push:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # README states Xcode 16.0+ / Swift 6.1+. latest-stable tracks forward as the
          # runner image updates; pin to an explicit version here if that ever regresses.
          xcode-version: latest-stable

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  ios-simulator-build:
    name: swift build (iOS Simulator, smoke)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-ios-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-ios-

      # Build-only: catches #if os(iOS) / platform-conditional breakage without the cost
      # or flakiness of booting a simulator to run the full suite there too.
      - name: xcodebuild for iOS Simulator
        run: |
          xcodebuild build \
            -scheme OCCTSwift \
            -destination 'generic/platform=iOS Simulator'
