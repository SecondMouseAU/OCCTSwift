name: code-style

# Rollout of the ecosystem's code-style policy here (#876); see
# docs/code-style-policy-proposal-2026-08.md in the `ecosystem` repo for the
# full rationale, and okf/policies/code-style.md for this repo's own policy.
#
# Unlike the OCCTSwiftScripts pilot (small enough to fully sweep in one PR),
# this repo is large (222 Swift files, 33 OCCTBridge C++ files, ~11,700
# pre-existing swift-format diagnostics and a multi-thousand-line-per-file
# clang-format gap measured on rollout day) so this uses gradual adoption: a
# checked-in exemption manifest (Scripts/style-manifest-*.txt) grandfathers
# every file that existed at rollout, and Scripts/check-style-manifest.py
# enforces that touching a manifest file means fixing it and removing it from
# the manifest in the same PR, not leaving it exempt while edited.
#
# swift-format, SwiftLint, and clang-format are blocking for everything NOT on
# a manifest: formatting has no judgment call in it once a file complies.
#
# The bridge half of that rollout is finished: Scripts/style-manifest-bridge.txt
# is now empty, so all 33 OCCTBridge files are enforced. That is why the
# pre-commit hook gained the clang-format check (Scripts/format-bridge.sh) and
# why the version is pinned below: with nothing grandfathered, OCCT's
# consecutive-alignment rules put almost every hand-written bridge addition in
# violation, and finding that out from a red PR costs a push per attempt.
# check-style-manifest.py is blocking (its whole job is catching a specific,
# unambiguous rule violation). The comment-ratio check is report-only by
# design (see its own header) and never fails.
#
# Pure text analysis, no OCCT build needed: still a macOS runner, for the same
# reason build-and-test needs one (swift-format/swiftlint/clang-format are all
# readily available via Homebrew there), but with none of that job's build
# time or its coupling to kernel-patch-pin drift.

on:
  pull_request:
    branches:
      - main
      - 'refactor/**'
  push:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

jobs:
  code-style:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # fetch-depth: 0, not the default shallow clone: check-style-manifest.py
      # diffs against origin/main's merge-base, which needs real history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install swift-format, SwiftLint
        run: brew install swift-format swiftlint

      # clang-format is PINNED, unlike the two above, and deliberately not installed from Homebrew:
      # `brew install clang-format` takes whatever is current, and clang-format's output changes
      # between major versions, so a Homebrew bump can turn a green `main` red with no code change
      # and a contributor on a different major produces a diff this job rejects. OCCT's own CI pins
      # for the same reason (its clang-format-check action pins 18.1.8 and hard-fails a mismatch).
      #
      # The PyPI wheel is the pin: a ~2 MB binary, not the full LLVM toolchain, so this stays about
      # as fast as the brew bottle it replaces (`brew install llvm@22` would also pin it, at a
      # gigabyte-scale download). Scripts/clang-format-version.txt is the single source of truth,
      # read here, by Scripts/format-bridge.sh and through it by the pre-commit hook.
      #
      # GITHUB_PATH prepends, so this clang-format wins over any other on the runner image.
      - name: Install pinned clang-format
        run: |
          version=$(grep -v '^#' Scripts/clang-format-version.txt | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet --disable-pip-version-check "clang-format==$version"
          echo /tmp/clang-format-venv/bin >> "$GITHUB_PATH"

      # Fails on a mismatch rather than only printing, so a pin that silently stopped resolving is a
      # red step instead of a formatting diff nobody can reproduce locally.
      - name: clang-format version assertion
        run: Scripts/format-bridge.sh --print-version

      - name: swift-format lint --strict (files not on the exemption manifest)
        run: |
          comm -23 \
            <(find Sources/OCCTSwift -name '*.swift' | sort) \
            <(grep -v '^#' Scripts/style-manifest-swift.txt | sort) \
            | tr '\n' '\0' \
            | xargs -0 swift-format lint --strict --configuration .swift-format

      - name: swiftlint lint --strict
        if: '!cancelled()'
        run: swiftlint lint --strict --config .swiftlint.yml

      # The file selection and check loop that used to be inline here live in the script now, so
      # this job, the pre-commit hook and a local run cannot check different files or different
      # flags. The self-test runs first, for the reason every other detector in this repo has one:
      # a --check that reports "all clear" because it is blind looks exactly like one reporting
      # "all clear" because the bridge is clean.
      - name: format-bridge.sh --self-test
        if: '!cancelled()'
        run: Scripts/format-bridge.sh --self-test

      - name: clang-format check (OCCTBridge files not on the exemption manifest)
        if: '!cancelled()'
        run: Scripts/format-bridge.sh --check

      - name: check-style-manifest.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/check-style-manifest.py --self-test

      - name: check-style-manifest.py
        if: '!cancelled()'
        run: python3 Scripts/check-style-manifest.py --base origin/main

      - name: comment-ratio-check.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/comment-ratio-check.py --self-test

      - name: comment-ratio-check.py (report-only, never fails)
        if: '!cancelled()'
        run: python3 Scripts/comment-ratio-check.py
