name: code-style

# Rollout of the ecosystem's code-style policy here (#876); see
# docs/code-style-policy-proposal-2026-08.md in the `ecosystem` repo for the
# full rationale, and okf/policies/code-style.md for this repo's own policy.
#
# This repo rolled the policy out gradually: a checked-in exemption manifest
# (Scripts/style-manifest-*.txt) grandfathered every file that existed at
# rollout (222 Swift files, 33 OCCTBridge files, ~11,700 swift-format
# diagnostics), and Scripts/check-style-manifest.py enforced that touching a
# manifest file meant fixing it and removing it from the manifest in the same
# PR. **That rollout is finished and the manifests are gone.** The last listed
# file was brought into compliance and the manifests and their checker were
# deleted, so there is no exemption list and nothing to grow back.
#
# swift-format, SwiftLint, and clang-format are blocking for every tracked
# file: formatting has no judgment call in it once a file complies. A violation
# that is deliberate is suppressed where it occurs, with swift-format's own
# `// swift-format-ignore: <Rule>`, so `git grep swift-format-ignore` is the
# complete list of exceptions. The version of clang-format is pinned below
# because OCCT's consecutive-alignment rules put almost every hand-written
# bridge addition in violation, and finding that out from a red PR costs a push
# per attempt, which is also why the pre-commit hook runs
# Scripts/format-bridge.sh. The comment-ratio check is report-only by design
# (see its own header) and never fails.
#
# Pure text analysis, no OCCT build needed: still a macOS runner, for the same
# reason build-and-test needs one (swift-format/swiftlint/clang-format are all
# readily available via Homebrew there), but with none of that job's build
# time or its coupling to kernel-patch-pin drift.

# Called from ci.yml, not triggered on its own. It used to be a separate workflow, and
# GitHub orders jobs only within one workflow, so the three checks that were separate files all
# started at once. Now ci.yml calls this after the cheaper checks (order and rationale are in
# ci.yml's comment above `code-structure`). `workflow_dispatch` is kept so it can still be run by
# hand. The `paths-ignore` this workflow carried is `changes.outputs.code` in ci.yml, and its own
# `concurrency` is gone because the caller's group already cancels a superseded run.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  code-style:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install swift-format, SwiftLint
        run: brew install swift-format swiftlint

      # clang-format is PINNED, unlike the two above, and deliberately not installed from Homebrew:
      # `brew install clang-format` takes whatever is current, and clang-format's output changes
      # between major versions, so a Homebrew bump can turn a green `main` red with no code change
      # and a contributor on a different major produces a diff this job rejects. OCCT's own CI pins
      # for the same reason (its clang-format-check action pins 18.1.8 and hard-fails a mismatch).
      #
      # The PyPI wheel is the pin: a ~2 MB binary, not the full LLVM toolchain, so this stays about
      # as fast as the brew bottle it replaces (`brew install llvm@22` would also pin it, at a
      # gigabyte-scale download). Scripts/clang-format-version.txt is the single source of truth,
      # read here, by Scripts/format-bridge.sh and through it by the pre-commit hook.
      #
      # GITHUB_PATH prepends, so this clang-format wins over any other on the runner image.
      - name: Install pinned clang-format
        run: |
          version=$(grep -v '^#' Scripts/clang-format-version.txt | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet --disable-pip-version-check "clang-format==$version"
          echo /tmp/clang-format-venv/bin >> "$GITHUB_PATH"

      # Fails on a mismatch rather than only printing, so a pin that silently stopped resolving is a
      # red step instead of a formatting diff nobody can reproduce locally.
      - name: clang-format version assertion
        run: Scripts/format-bridge.sh --print-version

      # The file selection and the lint loop used to be four lines of shell here, walking
      # `find Sources/OCCTSwift`: 230 of the repo's 1,730 tracked Swift files, with Tests/ (1,459),
      # Scripts/ (35), Sources/OCCTPlatform, Sources/OCCTTest, Sources/WASICompat and Package.swift
      # outside the step and nothing saying so. #2852. They live in the script now, for the reason
      # the clang-format steps below already give: one copy of the population, so this job, a local
      # run and the exemption manifests cannot describe different things.
      #
      # --require-swift-format is #2098's mode: a runner with no swift-format is a refusal here,
      # never a green step that linted nothing. The self-test runs first, same as format-bridge.sh.
      - name: check-swift-format.py --self-test
        run: python3 Scripts/check-swift-format.py --self-test --require-swift-format

      - name: swift-format lint --strict
        if: '!cancelled()'
        run: python3 Scripts/check-swift-format.py --require-swift-format

      - name: swiftlint lint --strict
        if: '!cancelled()'
        run: swiftlint lint --strict --config .swiftlint.yml

      # The file selection and check loop that used to be inline here live in the script now, so
      # this job, the pre-commit hook and a local run cannot check different files or different
      # flags. The self-test runs first, for the reason every other detector in this repo has one:
      # a --check that reports "all clear" because it is blind looks exactly like one reporting
      # "all clear" because the bridge is clean.
      - name: format-bridge.sh --self-test
        if: '!cancelled()'
        run: Scripts/format-bridge.sh --self-test

      - name: clang-format check (OCCTBridge)
        if: '!cancelled()'
        run: Scripts/format-bridge.sh --check

      - name: comment-ratio-check.py --self-test
        if: '!cancelled()'
        run: python3 Scripts/comment-ratio-check.py --self-test

      - name: comment-ratio-check.py (report-only, never fails)
        if: '!cancelled()'
        run: python3 Scripts/comment-ratio-check.py
