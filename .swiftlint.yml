# Deliberately narrow: `only_rules`, not `disabled_rules`. SwiftLint's default
# rule set covers two kinds of territory this repo doesn't want it opining on:
#
#   - Layout (colon/comma/opening_brace/line_length/...), swift-format already
#     owns this; running both fights, since they can disagree on the same line.
#   - Code-quality/complexity (identifier_name, cyclomatic_complexity,
#     function_body_length, nesting, type_body_length, file_length, ...), a
#     separate concern from code style, and one that overlaps this repo's own
#     code-structure policy (a file/type that needs a structural pass runs one
#     as its own scoped initiative per that policy, not as a side effect of a
#     style-lint gate). identifier_name's default 3-char minimum in particular
#     is not a fit for this codebase's short, conventional locals in dense
#     geometry code (u, v, p0, p1), measured on OCCTSwiftScripts' much smaller
#     tree, 548 hits on first run, none of them real problems; this tree would
#     be worse.
#
# What's left is the one rule that catches something swift-format has no
# equivalent for: a doc comment not attached to any declaration.
#
# See docs/code-style-policy-proposal-2026-08.md in the ecosystem repo for the
# full rationale, and okf/policies/code-style.md for this repo's own policy.

only_rules:
  - orphaned_doc_comment

# Tests/ and Scripts/ were excluded here until #2852, which is the same gap that issue found in
# the swift-format step: a lint whose population is a path nobody states. Measured on widening,
# `orphaned_doc_comment` had exactly one finding across the 1,494 files it newly reached
# (Issue633BlendedEdgesDuplicateReportTests.swift, a `///` block detached from its declaration by
# an inserted `// MARK:`, which is the same shape as both of #877's), fixed in that PR. 1,728
# files are linted now, against 234 before.
excluded:
  - .build
  - Libraries
  # `Sources/OCCTSwift/Surface.swift` and `Shape+Modeling.swift` were excluded here for two named
  # orphaned-doc-comment findings (#877). #877 closed and the exclusion stayed; both files lint
  # clean without it, and it is gone. Nothing under Sources/ or Tests/ is excluded now.
